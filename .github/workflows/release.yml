name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Re-pushing the same tag cancels an in-flight build for it; different tags don't
# cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is built per-arch in parallel (native, no cross-compile) instead of
          # one universal job compiling both arches — roughly halves the macOS wall time.
          - platform: macos-latest      # Apple silicon runner
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
          - platform: macos-13          # Intel runner
            args: "--target x86_64-apple-darwin"
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      # sccache caches individual compiler outputs in the GitHub Actions cache, so a
      # version bump that busts the target cache still reuses most compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.6

      # One rolling cache per runner (shared-key) instead of a new key per release:
      # stays well under the 10 GB repo limit, so the previous build's dependency
      # artifacts (DuckDB and friends) are always restored instead of recompiled.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: "release-${{ matrix.platform }}"
          cache-all-crates: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      # Export signing secrets as env vars ONLY when actually set. An unset secret
      # otherwise becomes a defined-but-empty var, which makes Tauri attempt signing
      # and fail on empty data. Absent secrets -> unsigned build.
      - name: Configure code-signing env
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                   APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              printf '%s<<__SIGN_EOF__\n%s\n__SIGN_EOF__\n' "$v" "${!v}" >> "$GITHUB_ENV"
            fi
          done

      # Pro license verification: release builds embed the public key (when the
      # secret is set) and their build time; without it the build is a community
      # build with everything unlocked. See RELEASING.md → Licenses.
      - name: Configure license key
        shell: bash
        env:
          ROWHOUSE_LICENSE_PUBKEY: ${{ secrets.ROWHOUSE_LICENSE_PUBKEY }}
        run: |
          echo "ROWHOUSE_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"
          if [ -n "$ROWHOUSE_LICENSE_PUBKEY" ]; then
            echo "ROWHOUSE_LICENSE_PUBKEY=$ROWHOUSE_LICENSE_PUBKEY" >> "$GITHUB_ENV"
          fi

      # Windows: import a code-signing certificate (PFX, base64) when provided;
      # tauri signs with it via bundle.windows.certificateThumbprint.
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item cert.pfx
          $conf = "apps/desktop/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          if (-not $json.bundle.windows) { $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue (@{}) }
          $json.bundle.windows | Add-Member -Force -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint
          $json.bundle.windows | Add-Member -Force -NotePropertyName digestAlgorithm -NotePropertyValue "sha256"
          $json.bundle.windows | Add-Member -Force -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com"
          $json | ConvertTo-Json -Depth 32 | Set-Content $conf

      # Signing is optional: the step above exports signing env vars only when their
      # secrets are set, so the default is an unsigned build. See RELEASING.md.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Rowhouse ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform from the assets below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
