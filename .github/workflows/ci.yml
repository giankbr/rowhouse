name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: rowhouse }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Rowhouse!Pass1" }
        ports: ["1433:1433"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env: { ORACLE_PASSWORD: rowhouse, APP_USER: rh, APP_USER_PASSWORD: rh }
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 5s --health-retries 30
      cassandra:
        image: cassandra:5
        env: { MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M }
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 10s --health-timeout 10s --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "true"
          xpack.security.http.ssl.enabled: "false"
          ELASTIC_PASSWORD: rowhouse
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -s -u elastic:rowhouse localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9201:9200"]
        options: >-
          --health-cmd "curl -s localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env: { CLICKHOUSE_USER: rh, CLICKHOUSE_PASSWORD: rh, CLICKHOUSE_DB: default }
        ports: ["8123:8123"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Start CockroachDB
        run: docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:latest-v24.3 start-single-node --insecure
      - name: Oracle Instant Client
        run: |
          sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1 || true
          curl -sSL -o /tmp/ic.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          sudo mkdir -p /opt/oracle && sudo unzip -q /tmp/ic.zip -d /opt/oracle
      - name: Start BigQuery emulator
        run: docker run -d --name bq -p 9050:9050 ghcr.io/goccy/bigquery-emulator:latest --project=test --dataset=sales
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null && break; sleep 2; done
          sleep 10
      - run: cargo test -p rowhouse-core -p rowhouse-mcp --no-fail-fast
        env:
          ROWHOUSE_TEST_PG: localhost:5432:postgres
          ROWHOUSE_TEST_PG_PASSWORD: postgres
          ROWHOUSE_TEST_MYSQL: localhost:3306:root:root:rowhouse
          ROWHOUSE_TEST_MSSQL: localhost:1433:sa:Rowhouse!Pass1
          ROWHOUSE_TEST_CH: localhost:8123:rh:rh
          ROWHOUSE_TEST_REDIS: localhost:6379
          ROWHOUSE_TEST_MONGO: localhost:27017
          ROWHOUSE_TEST_CASSANDRA: localhost:9042
          ROWHOUSE_TEST_COCKROACH: localhost:26257:root
          ROWHOUSE_TEST_ORACLE: localhost:1521:rh:rh:FREEPDB1
          ROWHOUSE_TEST_ES: http://localhost:9200
          ROWHOUSE_TEST_ES_USER: elastic
          ROWHOUSE_TEST_ES_PASSWORD: rowhouse
          ROWHOUSE_TEST_OPENSEARCH: http://localhost:9201
          ROWHOUSE_TEST_BIGQUERY: http://localhost:9050

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rowhouse-desktop exec playwright install --with-deps chromium
      - run: pnpm --filter rowhouse-desktop e2e

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter rowhouse-desktop exec vite build
      - run: node scripts/sidecar.mjs debug
      - run: cargo check -p rowhouse-desktop -p rowhouse-mcp
