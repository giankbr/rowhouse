[package]
name = "rowhouse-core"
description = "Database drivers, connection store and query engine for Rowhouse"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
futures-util = "0.3"
directories = "6"
keyring = "4"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "sqlite", "json",
] }

russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
csv = "1"
url = "2"
plist = "1"
roxmltree = "0.21"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
duckdb = { version = "1", features = ["bundled"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio"] }
mongodb = "3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
