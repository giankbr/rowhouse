[package]
name = "rowhouse-core"
description = "Database drivers, connection store and query engine for Rowhouse"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
futures-util = "0.3"
directories = "6"
keyring = "4"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json",
] }

[dev-dependencies]
tempfile = "3"
